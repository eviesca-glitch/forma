function generateWorkout(muscleGroup, durationConfig, drPhase = 2) {
  const { sets, exercises: targetCount, cardioMins } = durationConfig;

  // Standalone cardio session
  if (muscleGroup === "cardio") {
    const cardioPool = ALL_EX.filter(ex =>
      ex.category === "cardio" && ex.drSafe && ex.drPhase <= drPhase
      && ex.type === "time" // only time-based for cardio sessions
    );
    if (!cardioPool.length) return { exercises: [], cardio: null, muscleGroup, duration: durationConfig.mins };
    const shuffled = [...cardioPool].sort(() => Math.random() - 0.5);
    const count = durationConfig.mins <= 30 ? 1 : durationConfig.mins <= 45 ? 2 : 3;
    const secsEach = Math.floor((durationConfig.mins * 60) / count);
    const selected = shuffled.slice(0, count).map(ex => ({
      ...ex,
      workoutSets: 1,
      workoutReps: null,
      workoutSecs: secsEach,
      workoutWeight: 0,
    }));
    return { exercises: selected, cardio: null, muscleGroup, duration: durationConfig.mins };
  }

  // Filter exercises by muscle group and DR phase
  let pool = ALL_EX.filter(ex =>
    ex.drSafe && ex.drPhase <= drPhase && ex.category !== "cardio"
  );

  if (muscleGroup === "full_body") {
    const groups = ["glutes","legs","upper","core"];
    let selected = [];
    groups.forEach(g => {
      const gPool = pool.filter(ex => ex.category === g || ex.muscles.includes(g));
      if (gPool.length) selected.push(gPool[Math.floor(Math.random()*gPool.length)]);
    });
    const remaining = pool.filter(ex => !selected.find(s => s.id === ex.id));
    while (selected.length < targetCount && remaining.length > 0) {
      const idx = Math.floor(Math.random()*remaining.length);
      selected.push(remaining.splice(idx, 1)[0]);
    }
    pool = selected;
  } else if (muscleGroup === "calisthenics") {
    pool = pool.filter(ex => ex.category === "calisthenics" || ex.category === "core" || ex.category === "glutes");
  } else {
    const primary = pool.filter(ex =>
      ex.category === muscleGroup || ex.muscles.some(m => m.includes(muscleGroup))
    );
    const core = pool.filter(ex => ex.category === "core").slice(0, 2);
    const combined = [...primary];
    core.forEach(c => { if (!combined.find(x => x.id === c.id)) combined.push(c); });
    pool = combined;
  }

  const selected = [];
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  for (const ex of shuffled) {
    if (selected.length >= targetCount) break;
    if (!selected.find(s => s.id === ex.id)) selected.push(ex);
  }

  // Add cardio warm-up for non-cardio workouts
  const cardioOptions = ALL_EX.filter(ex => ex.category === "cardio" && ex.drSafe && ex.drPhase <= drPhase);
  const cardioEx = cardioOptions[Math.floor(Math.random() * cardioOptions.length)];

  return {
    exercises: selected.map(ex => ({
      ...ex,
      workoutSets: sets,
      workoutReps: ex.defaultReps ?? null,
      workoutSecs: ex.defaultSecs ?? null,
      workoutWeight: ex.defaultWeight ?? 0,
    })),
    cardio: cardioEx ? { ...cardioEx, workoutSecs: cardioMins * 60 } : null,
    muscleGroup,
    duration: durationConfig.mins,
  };
}

// ─── PROGRESS ENGINE ──────────────────────────────────────────────────────────

function analyzeFormaProgress(workoutLog) {
  const insights = [];
  const exSessions = {};

  for (const dt of Object.keys(workoutLog).sort()) {
    const day = workoutLog[dt];
    if (!day || typeof day !== "object") continue;
    for (const [exId, sets] of Object.entries(day)) {
      if (!Array.isArray(sets) || !sets.length) continue;
      const meaningful = sets.filter(s => (s.reps??0)>0||(s.seconds??0)>0);
      if (!meaningful.length) continue;
      if (!exSessions[exId]) exSessions[exId] = [];
      exSessions[exId].push({ date:dt, sets:meaningful });
    }
  }

  const getBest = (id, type) => {
    const s = exSessions[id];
    if (!s?.length) return 0;
    return Math.max(...s.flatMap(sess => sess.sets.map(set => type==="reps"?(set.reps??0):(set.seconds??0))));
  };

  const today = new Date();
  const cutoff14 = new Date(today); cutoff14.setDate(cutoff14.getDate()-14);
  const cutoff14Str = cutoff14.toISOString().split("T")[0];

  // DR progress check
  const deadBugBest = getBest("dead_bug","reps");
  const bridgeBest = getBest("glute_bridge","reps");
  const breathBest = getBest("diaphragmatic_breath","time");

  if (breathBest >= 60 && deadBugBest >= 8 && bridgeBest >= 15) {
    insights.push({
      type:"milestone", color:C.sage,
      title:"Phase 1 Core Complete",
      message:"Breathing, dead bug, and glute bridge are all strong.",
      action:"Ready for Phase 2: Pallof press, bird dog, and single-leg work. Your core foundation is solid.",
    });
  }

  // Per-exercise progress
  for (const [exId, sessions] of Object.entries(exSessions)) {
    if (sessions.length < 2) continue;
    const ex = ALL_EX.find(e => e.id === exId);
    if (!ex) continue;

    const recent = sessions.filter(s => s.date >= cutoff14Str).slice(-2);
    const allBest = getBest(exId, ex.type==="time"?"time":"reps");
    const tTarget = ex.type==="time" ? (ex.defaultSecs??0) : (ex.defaultReps??0);

    if (recent.length === 2) {
      const bothHit = recent.every(sess =>
        sess.sets.every(s => ex.type==="time"?(s.seconds??0)>=tTarget:(s.reps??0)>=tTarget)
      );
      if (bothHit && tTarget > 0) {
        const progressMap = {
          glute_bridge:   "Progress to Single-Leg Glute Bridge. Then build to Hip Thrust — the most effective glute exercise.",
          dead_bug:       "Add light ankle weight or extend hold time to 3s. Excellent core progress.",
          bird_dog:       "Add a resistance band around wrists for more challenge.",
          pallof_press:   "Increase cable weight by 2.5kg. Anti-rotation strength is building nicely.",
          goblet_squat:   "Add 2kg. When 15 reps feel easy, progress to barbell back squat.",
          romanian_deadlift: "Add 2.5kg each side. Focus on feeling the hamstring stretch — that's the signal.",
          hip_thrust:     "Add 5kg. Hip thrust builds the glutes faster than any other exercise.",
          db_chest_press: "Add 2kg each hand. Work toward 15 controlled reps.",
          db_row:         "Add 2kg. Full range of motion — feel the lat engage at the top.",
          lateral_raise:  "Add 1kg. Shoulders respond to high volume — keep reps at 15.",
          face_pull:      "Increase reps to 20 or add light resistance. Shoulder health priority.",
        };
        insights.push({
          type:"progress", color:C.gold,
          exName: ex.name,
          message:`Consistently hitting targets across 2 sessions.`,
          action: progressMap[exId] ?? `Increase weight by 5–10% or add 2 reps next session`,
        });
      }
    }

    // Plateau check
    const recent21 = sessions.filter(s => {
      const c = new Date(today); c.setDate(c.getDate()-21);
      return s.date >= c.toISOString().split("T")[0];
    });
    if (recent21.length >= 3 && allBest > 0) {
      const r21Best = Math.max(...recent21.flatMap(s => s.sets.map(set => ex.type==="time"?(set.seconds??0):(set.reps??0))));
      if (r21Best < allBest * 0.95) {
        insights.push({
          type:"plateau", color:C.warn,
          exName: ex.name,
          message:`No improvement in 3 weeks.`,
          action:`Try dropping weight 10%, focus on slow 3s eccentric phase. New stimulus breaks plateaus.`,
        });
      }
    }
  }

  // Sort milestones first
  insights.sort((a,b) => {
    const o = {milestone:0, progress:1, plateau:2};
    return (o[a.type]??3)-(o[b.type]??3);
  });
  return insights;
}

// ─── LOCAL STORAGE ────────────────────────────────────────────────────────────

function useLocalStorage(key, init) {
  const [val, setVal] = useState(() => {
    try {
      const s = localStorage.getItem(key);
      if (s) return JSON.parse(s);
    } catch {}
    // Cookie fallback for iOS PWA persistence
    try {
      const match = document.cookie.match(new RegExp("(?:^|; )" + key.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "=([^;]*)"));
      if (match) return JSON.parse(decodeURIComponent(match[1]));
    } catch {}
    return init;
  });
  const set = useCallback((v) => {
    setVal(prev => {
      const next = typeof v === "function" ? v(prev) : v;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      try {
        const encoded = encodeURIComponent(JSON.stringify(next));
        document.cookie = `${key}=${encoded}; max-age=31536000; path=/; SameSite=Strict`;
      } catch {}
      return next;
    });
  }, [key]);
  return [val, set];
}

async function dropboxSave(token, data) {

      "Authorization":"Bearer "+token,

  if (!r.ok) return null;
  return r.json();
}

function FStepper({ value, onChange, step=1, min=0, color }) {
  const [raw, setRaw] = useState(value===0?"":String(value));
  const isFocused = useRef(false);
  useEffect(() => { if (!isFocused.current) setRaw(value===0?"":String(value)); }, [value]);
  const commit = str => {
    const n = parseFloat(str);
    const valid = !isNaN(n) && n>=min;
    const next = valid?parseFloat(n.toFixed(2)):min;
    onChange(next); setRaw(next===0?"":String(next));
  };
  const nudge = dir => {
    const next = Math.max(min, parseFloat(((value||0)+dir*step).toFixed(2)));
    onChange(next);
  };
  return (
    <div style={{ display:"flex", alignItems:"center", background:C.surface, borderRadius:12, overflow:"hidden" }}>
      <button onMouseDown={e=>{e.preventDefault();nudge(-1);}}
        style={{ width:44,height:48,background:"none",border:"none",color:C.textSoft,fontSize:22,cursor:"pointer" }}>−</button>
      <input type="number" value={raw} placeholder="0"
        onFocus={e=>{isFocused.current=true;e.target.select();}}
        onChange={e=>setRaw(e.target.value)}
        onBlur={e=>{isFocused.current=false;commit(e.target.value);}}
        onKeyDown={e=>{if(e.key==="Enter")commit(raw);}}
        style={{ flex:1,height:48,background:"none",border:"none",color:C.text,
          fontSize:20,fontWeight:600,textAlign:"center",outline:"none",fontFamily:"'DM Sans',sans-serif"
        }}
      />
      <button onMouseDown={e=>{e.preventDefault();nudge(1);}}
        style={{ width:44,height:48,background:"none",border:"none",color:color??C.gold,fontSize:22,cursor:"pointer" }}>+</button>
    </div>
  );
}

function ExerciseLogger({ ex, sets, onUpdate, color }) {
  const isTime = ex.type === "time";
  const tReps = ex.workoutReps ?? ex.defaultReps ?? 0;
  const tSecs = ex.workoutSecs ?? ex.defaultSecs ?? 0;
  const tSets = ex.workoutSets ?? ex.sets ?? 3;
  const hasWeight = (ex.workoutWeight ?? ex.defaultWeight ?? 0) > 0 ||
    (!isTime && (ex.equipment?.includes("dumbbell") || ex.equipment?.includes("barbell") ||
     ex.equipment?.includes("cable") || ex.equipment?.includes("machine")));

  const didInit = useRef(false);
  useEffect(() => {
    if (!didInit.current && sets.length === 0) {
      didInit.current = true;
      const fresh = isTime
        ? { id:Date.now(), seconds: tSecs > 0 ? tSecs : 600, effort:5, note:"" }
        : { id:Date.now(), reps: tReps > 0 ? tReps : 10, weight:ex.workoutWeight??ex.defaultWeight??0, effort:5, note:"" };
      onUpdate([fresh]);
    }
  }, []);

  const addSet = () => {
    const last = sets[sets.length-1];
    const fallback = isTime
      ? { id:Date.now(), seconds:tSecs, effort:5, note:"" }
      : { id:Date.now(), reps:tReps, weight:ex.workoutWeight??0, effort:5, note:"" };
    onUpdate([...sets, last?{...last,id:Date.now(),note:""}:fallback]);
  };
  const upd = (i,f,v) => onUpdate(sets.map((s,idx)=>idx===i?{...s,[f]:v}:s));
  const rem = (i) => onUpdate(sets.filter((_,idx)=>idx!==i));

  return (
    <div style={{ marginTop:10 }}>
      {sets.map((s,i) => {
        const hit = isTime?(s.seconds>=tSecs&&tSecs>0):(s.reps>=tReps&&tReps>0);
        return (
          <div key={s.id??i} style={{
            background:C.surface, borderRadius:14, padding:14, marginBottom:10,
            border:`1px solid ${hit?(color??C.gold)+"88":C.border}`
          }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <div style={{
                  width:26,height:26,borderRadius:"50%",
                  background:hit?(color??C.gold):C.border,
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:11,fontWeight:700,color:hit?"#fff":C.textSoft,
                  transition:"all 0.2s"
                }}>S{i+1}</div>
                {hit && <span style={{fontSize:11,color:color??C.gold,fontWeight:600}}>✓ Done</span>}
              </div>
              <button onClick={()=>rem(i)} style={{background:"none",border:"none",color:C.border,cursor:"pointer",fontSize:20}}>×</button>
            </div>

            {isTime ? (
              <div>
                <FLabel>Seconds{tSecs>0?<span style={{color:C.textSoft,fontWeight:400}}> / {tSecs}s</span>:""}</FLabel>
                <FStepper value={s.seconds} onChange={v=>upd(i,"seconds",v)} step={5} color={color} />
              </div>
            ) : (
              <div style={{ display:"flex", gap:10 }}>
                <div style={{ flex:1 }}>
                  <FLabel>Reps{tReps>0?<span style={{color:C.textSoft,fontWeight:400}}> / {tReps}</span>:""}</FLabel>
                  <FStepper value={s.reps} onChange={v=>upd(i,"reps",v)} step={1} color={color} />
                </div>
                {hasWeight && (
                  <div style={{ flex:1 }}>
                    <FLabel>Weight (kg)</FLabel>
                    <FStepper value={s.weight??0} onChange={v=>upd(i,"weight",v)} step={2.5} color={color} />
                  </div>
                )}
              </div>
            )}

            <div style={{ marginTop:12 }}>
              <FLabel>Effort <span style={{color:color??C.gold,fontWeight:500}}>{s.effort}/10</span></FLabel>
              <ProgressDots value={s.effort} onChange={v=>upd(i,"effort",v)} color={color} />
            </div>

            <input placeholder="Note..."
              value={s.note} onChange={e=>upd(i,"note",e.target.value)}
              style={{
                background:C.card, border:`1px solid ${C.border}`, borderRadius:10,
                color:C.text, padding:"9px 12px", fontSize:13, width:"100%",
                boxSizing:"border-box", outline:"none", marginTop:10,
                fontFamily:"'DM Sans',sans-serif"
              }}
            />
          </div>
        );
      })}
      <button onClick={addSet} style={{
        width:"100%", padding:"12px", borderRadius:12,
        border:`1.5px dashed ${(color??C.gold)}88`, background:`${(color??C.gold)}0a`,
        color:color??C.gold, cursor:"pointer", fontSize:13, fontWeight:600,
        fontFamily:"'DM Sans',sans-serif"
      }}>
        + Add Set {tSets>0?`(${sets.length}/${tSets})`:""}
      </button>
    </div>
  );
}

  const [showSwap, setShowSwap] = useState(false);
  const activeEx = {
    ...ex,
    workoutSets: workoutSets ?? ex.sets ?? 3,
    workoutReps: workoutReps ?? ex.defaultReps ?? null,
    workoutSecs: workoutSecs ?? ex.defaultSecs ?? null,
    workoutWeight: workoutWeight ?? ex.defaultWeight ?? 0,
  };
  const handleSwap = (newEx) => { setEx(newEx); setShowSwap(false); onUpdate([]); };
  return (
    <div style={{ marginBottom:10 }}>
      <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:4 }}>
        <button onClick={() => setShowSwap(s => !s)} style={{
          background:"none", border:`1px dashed ${color??C.gold}66`,
          borderRadius:8, color:color??C.gold, cursor:"pointer",
          fontSize:11, padding:"3px 10px", fontFamily:"'DM Sans',sans-serif", fontWeight:600
        }}>{showSwap ? "Cancel" : "↔ Swap"}</button>
      </div>
      {showSwap && <ExerciseSwapPicker currentEx={ex} drPhase={drPhase} onSelect={handleSwap} onClose={() => setShowSwap(false)} color={color} />}
      <ExerciseCard ex={activeEx} sets={sets} onUpdate={onUpdate} color={color} drPhase={drPhase} />
    </div>
  );
}

function WorkoutGeneratorView({ workoutLog, setWorkoutLog, drPhase }) {
  const [selectedGroup, setSelectedGroup] = useState(null);
  const [selectedDuration, setSelectedDuration] = useState(null);
  const [currentWorkout, setCurrentWorkout] = useState(null);
  const todayKey = useMemo(()=>new Date().toISOString().split("T")[0],[]);
  const todayLog = workoutLog?.[todayKey] ?? {};

  const generate = () => {
    if (!selectedGroup || !selectedDuration) return;
    if (selectedGroup === "cardio") {
      setCurrentWorkout({ muscleGroup:"cardio", exercises:[], cardio:null, duration:selectedDuration });
      return;
    }
    const dur = DURATIONS.find(d=>d.mins===selectedDuration);
    setCurrentWorkout(generateWorkout(selectedGroup, dur, drPhase));
  };

  const updateExercise = useCallback((exId, sets) => {
    setWorkoutLog(prev => ({ ...prev, [todayKey]: { ...(prev[todayKey]??{}), [exId]: sets } }));
  }, [todayKey, setWorkoutLog]);

  // CARDIO PICKER
  if (currentWorkout?.muscleGroup === "cardio") {
    const cardioPool = ALL_EX.filter(ex =>
      ex.category === "cardio" && ex.drSafe && ex.drPhase <= drPhase && ex.type === "time"
    );
    const dur = selectedDuration ?? 45;
    return (
      <div style={{ paddingBottom:90 }}>
        <div style={{ padding:"16px 18px 14px", borderBottom:`1px solid ${C.border}` }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div>
              <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:26, fontWeight:600, color:C.text }}>Cardio</div>
              <div style={{ fontSize:11, color:C.textSoft, marginTop:4, letterSpacing:1, fontFamily:"'DM Sans',sans-serif" }}>
                {dur} MIN · TAP ANY TO LOG
              </div>
            </div>
            <button onClick={()=>setCurrentWorkout(null)} style={{
              background:"none", border:`1px solid ${C.border}`, borderRadius:8,
              color:C.textSoft, cursor:"pointer", fontSize:11, padding:"4px 10px", fontFamily:"'DM Sans',sans-serif"
            }}>← Back</button>
          </div>
        </div>
        <div style={{ padding:"14px 18px 0" }}>
          <FLabel color={C.rose}>CHOOSE YOUR CARDIO</FLabel>
          {cardioPool.map(ex => {
            const activeEx = { ...ex, workoutSets:1, workoutReps:null, workoutSecs:dur*60, workoutWeight:0 };
            return (
              <ExerciseCard key={ex.id} ex={activeEx}
                sets={todayLog[ex.id]??[]} onUpdate={s=>updateExercise(ex.id,s)}

          })}
        </div>
      </div>
    );
  }

  // REGULAR WORKOUT
  if (currentWorkout) {
    const muscleGroup = currentWorkout.muscleGroup;
    const group = MUSCLE_GROUPS.find(g=>g.id===muscleGroup);
    const completedCount = currentWorkout.exercises.filter(ex => {
      const s = todayLog[ex.id]??[];
      return s.some(set=>ex.type==="time"?(set.seconds??0)>0:(set.reps??0)>0);
    }).length ?? 0;
    return (
      <div style={{ paddingBottom:90 }}>
        <div style={{ padding:"16px 18px 14px", borderBottom:`1px solid ${C.border}` }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div>
              <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:26, fontWeight:600, color:C.text, lineHeight:1 }}>
                {group?.label} Day
              </div>
              <div style={{ fontSize:11, color:C.textSoft, marginTop:4, letterSpacing:1, fontFamily:"'DM Sans',sans-serif" }}>
                {currentWorkout.duration} MIN · {currentWorkout.exercises.length} EXERCISES

              {completedCount > 0 && (

                  borderRadius:10, padding:"5px 12px", textAlign:"center" }}>
                  <div style={{ fontSize:16, fontWeight:700, color:group?.color??C.gold }}>{completedCount}/{currentWorkout.exercises.length}</div>
                  <div style={{ fontSize:9, color:C.textSoft, letterSpacing:1 }}>DONE</div>
                </div>

              <button onClick={()=>setCurrentWorkout(null)} style={{
                background:"none", border:`1px solid ${C.border}`, borderRadius:8,
                color:C.textSoft, cursor:"pointer", fontSize:11, padding:"4px 10px", fontFamily:"'DM Sans',sans-serif"
              }}>← Change</button>
            </div>
          </div>
        </div>
        {currentWorkout.cardio && (
          <div style={{ margin:"14px 18px 0" }}>
            <FLabel color={C.rose}>CARDIO WARM-UP</FLabel>
            <ExerciseCard ex={currentWorkout.cardio} sets={todayLog[currentWorkout.cardio.id]??[]}
              onUpdate={s=>updateExercise(currentWorkout.cardio.id,s)} color={C.rose} drPhase={drPhase} />

        <div style={{ padding:"14px 18px 0" }}>

      <FLabel>FOCUS AREA</FLabel>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:24 }}>
        {MUSCLE_GROUPS.map(g => (
          <button key={g.id} onClick={()=>setSelectedGroup(g.id)} style={{
            padding:"16px 14px", borderRadius:14, cursor:"pointer", textAlign:"left",
            border:`1.5px solid ${selectedGroup===g.id?g.color:C.border}`,
            background:selectedGroup===g.id?`${g.color}12`:C.card,
            boxShadow:"0 1px 3px rgba(44,35,22,0.05)", transition:"all 0.15s"
          }}>
            <div style={{ fontSize:18, marginBottom:6 }}>{g.icon}</div>

        <div style={{ fontSize:12, color:C.textMid, lineHeight:1.6, fontFamily:"'DM Sans',sans-serif" }}>
          All workouts filtered for diastasis recti safety. Phase {drPhase} progressions active.

      </div>

function ProgressView({ workoutLog, drPhase }) {
  const insights = useMemo(()=>analyzeFormaProgress(workoutLog),[workoutLog]);

  // Simple charts
  const dates = useMemo(()=>Object.keys(workoutLog).sort().slice(-10),[workoutLog]);

    label:dt.slice(5),
    value:Object.values(workoutLog[dt]??{}).filter(s=>Array.isArray(s)&&s.length>0).length
  })),[dates,workoutLog]);

  const totalSessions = Object.keys(workoutLog).length;
  const totalSets = Object.values(workoutLog).reduce((a,day)=>

      {/* Workout frequency chart */}

          <FLabel>COACH INSIGHTS</FLabel>

              borderRadius:14, padding:14, marginBottom:10

              {ins.type==="milestone" && (
                <>
                  <div style={{ fontSize:10,color:ins.color,fontWeight:700,letterSpacing:1.5,marginBottom:6 }}>🎯 MILESTONE</div>
                  <div style={{ fontSize:14,fontWeight:600,color:C.text,marginBottom:6,fontFamily:"'DM Sans',sans-serif" }}>{ins.title}</div>
                </>

                <div style={{ fontSize:10,color:ins.color,fontWeight:700,letterSpacing:1.5,marginBottom:6 }}>▲ PROGRESS READY · {ins.exName}</div>

              {ins.type==="plateau" && (
                <div style={{ fontSize:10,color:ins.color,fontWeight:700,letterSpacing:1.5,marginBottom:6 }}>◆ PLATEAU · {ins.exName}</div>
              )}
              <div style={{ fontSize:12,color:C.textMid,lineHeight:1.6,marginBottom:8,fontFamily:"'DM Sans',sans-serif" }}>{ins.message}</div>
              <div style={{ fontSize:12,color:ins.color,lineHeight:1.5,paddingTop:8,borderTop:`1px solid ${ins.color}22`,fontFamily:"'DM Sans',sans-serif" }}>

          <div style={{ fontSize:12,color:C.textSoft,fontFamily:"'DM Sans',sans-serif" }}>

      {totalSessions===0 && (
        <FCard style={{ textAlign:"center", padding:"24px 16px" }}>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:18, color:C.text, marginBottom:6 }}>
            Your journey starts today
          </div>
          <div style={{ fontSize:12,color:C.textSoft,fontFamily:"'DM Sans',sans-serif" }}>
            Complete your first workout to see progress insights here
          </div>
        </FCard>
      )}
    </div>
  );
}

function SettingsView({ workoutLog, setWorkoutLog, drPhase, setDrPhase }) {
  const [token, setToken] = useLocalStorage("forma_dropbox","");
  const [tokenInput, setTokenInput] = useState("");
  const [showSetup, setShowSetup] = useState(false);
  const [syncStatus, setSyncStatus] = useState("idle");
  const [lastSync, setLastSync] = useLocalStorage("forma_last_sync",null);
  const [restoreConfirm, setRestoreConfirm] = useState(false);
  const [msg, setMsg] = useState("");

  const handleSave = async () => {
    if (!token) return;
    setSyncStatus("syncing"); setMsg("");
    try {
      const ok = await dropboxSave(token,{workoutLog,drPhase,savedAt:new Date().toISOString()});
      if (ok) { setSyncStatus("ok"); setLastSync(new Date().toISOString()); }
      else { setSyncStatus("error"); setMsg("Save failed."); }
    } catch { setSyncStatus("error"); setMsg("Network error."); }
  };

  const handleRestore = async () => {
    setSyncStatus("syncing"); setMsg("");
    try {
      const data = await dropboxRestore(token);
      if (!data) { setSyncStatus("error"); setMsg("No backup found."); return; }
      if (data.workoutLog) setWorkoutLog(data.workoutLog);
      if (data.drPhase) setDrPhase(data.drPhase);
      setSyncStatus("ok");
      setMsg("✓ Restored from "+new Date(data.savedAt).toLocaleDateString());
      setRestoreConfirm(false);
    } catch { setSyncStatus("error"); setMsg("Restore failed."); }
  };

  const connectToken = async () => {
    if (!tokenInput.trim()) return;
    setSyncStatus("syncing");
    try {
      const r = await fetch("https://api.dropboxapi.com/2/check/user",{
        method:"POST",headers:{"Authorization":"Bearer "+tokenInput.trim(),"Content-Type":"application/json"},
        body:JSON.stringify({query:"check"})
      });
      if (r.ok) {
        setToken(tokenInput.trim()); setSyncStatus("ok");
        setMsg("✓ Dropbox connected!"); setShowSetup(false); setTokenInput("");
      } else { setSyncStatus("error"); setMsg("Invalid token."); }
    } catch { setSyncStatus("error"); setMsg("Network error."); }
  };

  const autoSaveTimer = useRef(null);
  useEffect(() => {
    if (!token) return;
    if (autoSaveTimer.current) clearTimeout(autoSaveTimer.current);
    autoSaveTimer.current = setTimeout(() => {
      dropboxSave(token,{workoutLog,drPhase,savedAt:new Date().toISOString()})
        .then(ok => { if(ok){setSyncStatus("ok");setLastSync(new Date().toISOString());} })
        .catch(()=>{});
    }, 3000);
    return ()=>clearTimeout(autoSaveTimer.current);
  }, [workoutLog, drPhase, token]);

  const statusColor = {idle:C.border,syncing:C.warn,ok:C.sage,error:C.rose}[syncStatus];

  return (
    <div style={{ padding:"18px 18px 90px" }}>
      <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:28, fontWeight:600,
        color:C.text, marginBottom:22 }}>Settings</div>

      {/* DR Phase */}
      <FCard>
        <FLabel>DIASTASIS RECTI PHASE</FLabel>
        <div style={{ fontSize:12,color:C.textMid,lineHeight:1.7,marginBottom:14,fontFamily:"'DM Sans',sans-serif" }}>
          <strong style={{color:C.text}}>Phase 1</strong> — Early recovery: breathing, dead bug, heel slides<br/>
          <strong style={{color:C.text}}>Phase 2</strong> — Building strength: bridges, pallof press, most gym exercises<br/>
          <strong style={{color:C.text}}>Phase 3</strong> — Advanced: full range, running, jumping cleared by physio
        </div>
        <div style={{ display:"flex", gap:8 }}>
          {[1,2,3].map(p => (
            <button key={p} onClick={()=>setDrPhase(p)} style={{
              flex:1, padding:"11px", borderRadius:12,
              border:`1.5px solid ${drPhase===p?C.sage:C.border}`,
              background:drPhase===p?`${C.sage}18`:C.card,
              color:drPhase===p?C.sage:C.textSoft,
              cursor:"pointer", fontSize:14, fontWeight:600,
              fontFamily:"'DM Sans',sans-serif"
            }}>Phase {p}</button>
          ))}
        </div>
      </FCard>

      {/* Dropbox */}
      <FCard>
        <FLabel>DROPBOX BACKUP</FLabel>
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:token?14:0 }}>
          <div style={{ width:8,height:8,borderRadius:"50%",background:statusColor,flexShrink:0,
            boxShadow:syncStatus==="ok"?`0 0 8px ${statusColor}`:"none" }} />
          <div style={{ flex:1 }}>
            <div style={{ fontSize:12,color:statusColor,fontWeight:600,fontFamily:"'DM Sans',sans-serif" }}>
              {({idle:"Not configured",syncing:"Syncing...",ok:"Synced ✓",error:"Error"})[syncStatus]}
            </div>
            {lastSync&&syncStatus==="ok"&&(
              <div style={{ fontSize:10,color:C.textSoft,marginTop:1,fontFamily:"'DM Sans',sans-serif" }}>
                {new Date(lastSync).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"})} · {new Date(lastSync).toLocaleDateString("en-US",{month:"short",day:"numeric"})}
              </div>
            )}
          </div>
          <button onClick={()=>setShowSetup(s=>!s)} style={{
            background:"none",border:`1px solid ${C.border}`,borderRadius:8,
            color:C.textSoft,cursor:"pointer",fontSize:11,padding:"4px 10px",
            fontFamily:"'DM Sans',sans-serif"
          }}>{token?"change":"setup"}</button>
        </div>

        {showSetup && (
          <div style={{ background:C.surface,borderRadius:10,padding:14,marginBottom:12 }}>
            <div style={{ color:C.textMid,fontSize:12,lineHeight:1.8,marginBottom:12,fontFamily:"'DM Sans',sans-serif" }}>
              <strong style={{color:C.text}}>3-step setup:</strong><br/>
              1. Go to <strong style={{color:C.gold}}>dropbox.com/developers/apps</strong><br/>
              2. Create App → Scoped → Full Dropbox → name it <strong style={{color:C.text}}>Forma</strong><br/>
              3. Permissions: check files.content.write + read → Generate token
            </div>
            <input placeholder="Paste Dropbox token..."
              value={tokenInput} onChange={e=>setTokenInput(e.target.value)}
              style={{
                background:C.card,border:`1px solid ${C.border}`,borderRadius:8,
                color:C.text,padding:"10px 12px",fontSize:12,width:"100%",
                boxSizing:"border-box",outline:"none",marginBottom:10,
                fontFamily:"'DM Sans',sans-serif"
              }}
            />
            <FButton onClick={connectToken} style={{ width:"100%" }}>Connect Dropbox</FButton>
          </div>
        )}

        {token && !showSetup && (
          <div style={{ display:"flex", gap:8 }}>
            <FButton onClick={handleSave} style={{ flex:2 }}>
              {syncStatus==="syncing"?"Saving...":"↑ Backup"}
            </FButton>
            {!restoreConfirm
              ? <FButton onClick={()=>setRestoreConfirm(true)} variant="outline" color={C.sky} style={{ flex:1 }}>↓ Restore</FButton>
              : <FButton onClick={handleRestore} variant="outline" color={C.rose} style={{ flex:1 }}>Confirm?</FButton>
            }
          </div>
        )}
        {msg && <div style={{ fontSize:12,color:msg.startsWith("✓")?C.sage:C.rose,marginTop:10,fontFamily:"'DM Sans',sans-serif" }}>{msg}</div>}
      </FCard>

      {/* Install */}
      <FCard>
        <FLabel>INSTALL ON HOME SCREEN</FLabel>
        <div style={{ color:C.textMid,fontSize:13,lineHeight:1.8,fontFamily:"'DM Sans',sans-serif" }}>
          <strong style={{color:C.text}}>iPhone Safari:</strong> Share → "Add to Home Screen"<br/>
          <strong style={{color:C.text}}>Android Chrome:</strong> ⋮ → "Add to Home screen"
        </div>
      </FCard>

      <div style={{ fontSize:11,color:C.border,textAlign:"center",marginTop:20,
        fontFamily:"'DM Sans',sans-serif",letterSpacing:1 }}>
        FORMA · All data stays on your device
      </div>
    </div>
  );
}

        position:"sticky", top:0, zIndex:10,
        background:C.bg, borderBottom:`1px solid ${C.border}`,
        padding:"14px 18px 12px",
        display:"flex", justifyContent:"space-between", alignItems:"center"
      }}>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:26, fontWeight:600,
          letterSpacing:1, color:C.text, lineHeight:1 }}>
          Forma
        </div>
        <div style={{ fontSize:11, color:C.textSoft, letterSpacing:0.5 }}>
          {new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}
        </div>
      </div>

      {/* Content */}
      <div className="view" key={tab} style={{ paddingTop:4 }}>
        {tab==="workout"  && <WorkoutGeneratorView workoutLog={workoutLog} setWorkoutLog={setWorkoutLog} drPhase={drPhase} />}
        {tab==="progress" && <ProgressView workoutLog={workoutLog} drPhase={drPhase} />}
        {tab==="settings" && <SettingsView workoutLog={workoutLog} setWorkoutLog={setWorkoutLog} drPhase={drPhase} setDrPhase={setDrPhase} />}
      </div>

      {/* Bottom nav */}
      <div style={{
        position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
        width:"100%", maxWidth:480,
        background:"rgba(250,247,242,0.97)", backdropFilter:"blur(12px)",
        borderTop:`1px solid ${C.border}`,
        display:"flex",
        paddingBottom:"max(10px, env(safe-area-inset-bottom))",
        paddingTop:8, zIndex:20
      }}>
        {tabs.map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            flex:1, background:"none", border:"none", cursor:"pointer",
            display:"flex", flexDirection:"column", alignItems:"center", gap:4,
            color: tab===t.id ? C.gold : C.border,
            padding:"2px 4px", transition:"color 0.12s"
          }}>
            <span style={{ fontSize:17, lineHeight:1 }}>{t.icon}</span>
            <span style={{ fontSize:10, letterSpacing:1.5, fontWeight:600 }}>{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
